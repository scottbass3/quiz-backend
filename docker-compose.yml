services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizz}
      POSTGRES_DB: ${POSTGRES_DB:-quizz}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizz} -d ${POSTGRES_DB:-quizz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dragonfly: a Redis-compatible store holding the state of running games
  # (the API talks to it with the Redis protocol, see REDIS_ADDR).
  # It has no append-only file: it snapshots /data every minute and reloads
  # the snapshot at startup.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    restart: unless-stopped
    command:
      - dragonfly
      - --logtostderr
      - --dir=/data
      - --dbfilename=quizz
      - --snapshot_cron=* * * * *
      - --proactor_threads=2
      - --maxmemory=512mb
    ulimits:
      memlock: -1
    ports:
      - "${DRAGONFLY_PORT:-6379}:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api: &api
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-quizz}:${POSTGRES_PASSWORD:-quizz}@postgres:5432/${POSTGRES_DB:-quizz}?sslmode=disable"
      REDIS_ADDR: "dragonfly:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      GAME_INITIAL_LIVES: "${GAME_INITIAL_LIVES:-3}"
      GAME_FINISHED_TTL: "${GAME_FINISHED_TTL:-10m}"
      GAME_IDLE_TTL: "${GAME_IDLE_TTL:-2h}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      SESSION_SECRET: "${SESSION_SECRET:-dev-secret-change-in-production}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URL: "${OIDC_REDIRECT_URL:-http://localhost:8080/auth/callback}"
      OIDC_FRONTEND_URL: "${OIDC_FRONTEND_URL:-http://localhost:5173}"
      OIDC_ROLE_CLAIM: "${OIDC_ROLE_CLAIM:-role}"
      OIDC_ADMIN_ROLE: "${OIDC_ADMIN_ROLE:-admin}"
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
    working_dir: /app

  # A second API instance sharing Postgres and Redis, to try multi-instance
  # setups: `make up-multi`. It runs without hot reload, since two air builds
  # would write the same binary in the mounted source tree.
  api2:
    <<: *api
    profiles: ["multi"]
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HTTP_PORT_2:-8081}:8080"
    command: ["go", "run", "-buildvcs=false", "./cmd/api"]

  # Round-robin load balancer in front of api and api2 (profile "multi"),
  # on port LB_PORT (default 8090).
  lb:
    image: nginx:1.27-alpine
    profiles: ["multi"]
    restart: unless-stopped
    depends_on:
      - api
      - api2
    ports:
      - "${LB_PORT:-8090}:80"
    volumes:
      - ./tools/lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  ui:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${UI_PORT:-5173}:5173"
    environment:
      # Proxy target: inside Docker the API is reachable via the service name
      VITE_API_TARGET: "http://api:8080"
    volumes:
      - ./tools/test-ui:/app
      - node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  dragonfly_data:
  go_mod_cache:
  node_modules:
