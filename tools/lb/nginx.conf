# Round-robin load balancer in front of the API instances (make up-multi).
# Requests of one game, including its WebSockets, may land on any instance.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream quizz_api {
    server api:8080;
    server api2:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://quizz_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s; # longer than the 54 s WebSocket ping
    }
}
