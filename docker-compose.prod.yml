# Production stack: API replicas behind an nginx load balancer, with
# Postgres (catalog and history) and Dragonfly (state of running games).
#
#   cp .env.prod.example .env.prod   # then fill it in
#   make prod-up                     # docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only the load balancer is published. Terminate TLS in front of it (reverse
# proxy, cloud load balancer) and keep SESSION_COOKIE_SECURE=true.
# The test UI is a development tool and is not part of this stack.

name: quizz-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-quizz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis-compatible store for game state. Snapshots every minute to /data and
  # reloads the snapshot at startup. DFLY_* variables set Dragonfly flags.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    restart: always
    command:
      - dragonfly
      - --logtostderr
      - --dir=/data
      - --dbfilename=quizz
      - --snapshot_cron=* * * * *
    environment:
      DFLY_requirepass: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
      DFLY_maxmemory: ${DRAGONFLY_MAXMEMORY:-1gb}
      DFLY_proactor_threads: ${DRAGONFLY_THREADS:-2}
    ulimits:
      memlock: -1
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$DFLY_requirepass\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: quizz-api:${API_TAG:-latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    deploy:
      replicas: ${API_REPLICAS:-2}
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-quizz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quizz}?sslmode=disable"
      REDIS_ADDR: "dragonfly:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      GAME_INITIAL_LIVES: "${GAME_INITIAL_LIVES:-3}"
      GAME_FINISHED_TTL: "${GAME_FINISHED_TTL:-10m}"
      GAME_IDLE_TTL: "${GAME_IDLE_TTL:-2h}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env.prod}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      # Without OIDC, identity comes from client headers: never disable it on
      # a public deployment.
      OIDC_ENABLED: "${OIDC_ENABLED:-true}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URL: "${OIDC_REDIRECT_URL:-}"
      OIDC_FRONTEND_URL: "${OIDC_FRONTEND_URL:-}"
      OIDC_ROLE_CLAIM: "${OIDC_ROLE_CLAIM:-role}"
      OIDC_ADMIN_ROLE: "${OIDC_ADMIN_ROLE:-admin}"

  lb:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  dragonfly_data:
