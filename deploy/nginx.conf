# Production load balancer: round-robin over every API replica.
# TLS is expected to be terminated in front of this proxy (see
# docker-compose.prod.yml); it only speaks HTTP on port 80.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's embedded DNS: "api" resolves to every replica, and is re-resolved
# every 10 s, so scaling or restarting replicas needs no nginx reload.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream quizz_api {
    zone quizz_api 64k;
    server api:8080 resolve;
}

server {
    listen 80;

    location / {
        proxy_pass http://quizz_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # longer than the 54 s WebSocket ping
    }
}
